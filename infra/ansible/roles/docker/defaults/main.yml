---
docker_apt_gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_apt_repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# User added to the docker group so the airflow_stack role can run compose
# without sudo. Defaults to the SSH user.
docker_group_users:
  - "{{ ansible_user }}"
