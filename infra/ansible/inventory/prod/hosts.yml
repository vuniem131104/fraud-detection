# Fill ansible_host with the VM IP from Terraform:
#   terraform -chdir=infra/terraform/environments/prod output -raw vm_external_ip
#
# SSH options:
#   - External IP: set ansible_host to it and ansible_user to your OS-Login user.
#   - IAP tunnel (no public IP): keep ansible_host as the internal IP and set
#     ansible_ssh_common_args to the gcloud IAP ProxyCommand (example below).
all:
  children:
    airflow_mlflow:
      hosts:
        airflow-mlflow-1:
          ansible_host: "10.128.0.35"        # internal IP (terraform output -raw vm_internal_ip); đổi lại nếu VM được tạo lại
          ansible_user: "vulonghoaniem131104_gmail_com"   # OS-Login user = tài khoản gcloud đang auth
          # Key mà gcloud/OS Login dùng (KHÔNG phải id_ed25519 mặc định)
          ansible_ssh_private_key_file: "~/.ssh/google_compute_engine"
          # VM internal-only (không external IP) => vào qua IAP tunnel:
          ansible_ssh_common_args: >-
            -o IdentitiesOnly=yes
            -o ProxyCommand="gcloud compute start-iap-tunnel airflow-mlflow-fraud-detection %p
            --listen-on-stdin --project=project-57f7ef9a-6059-4068-ae7
            --zone=us-central1-a --verbosity=warning"
