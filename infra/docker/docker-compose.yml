  # ===================================================================
  # MLflow — tracking server + model registry
  #   UI / API : http://localhost:5000   (khớp MLFLOW_TRACKING_URI trong .env)
  #   Backend  : Postgres riêng ở cổng 5433 (5432 đã bị stack data_pipelines dùng)
  #   Artifact : volume mlflow-artifacts, phục vụ qua --serve-artifacts nên
  #              client không cần tự truy cập đường dẫn lưu trữ
  # ===================================================================
  mlflow-postgres:
    image: postgres:16
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    ports:
      - "5433:5432"   # cổng khác 5432 để chạy song song với Postgres của data pipeline
    volumes:
      - mlflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: fraud-detection/mlflow:3.12.0
    container_name: mlflow
    environment:
      TZ: Asia/Ho_Chi_Minh
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      # trong docker network dùng tên service; DB nằm ở cổng 5432 BÊN TRONG container
      - --backend-store-uri
      - postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow-postgres:5432/${MLFLOW_DB}
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  mlflow-pgdata:      # backend store của MLflow (experiment, run, registry)
  mlflow-artifacts:   # model artifact do MLflow phục vụ
