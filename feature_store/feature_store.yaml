project: fraud_detection

provider: local

# v2: cần cho field kiểu Long/Int64 trong online store
entity_key_serialization_version: 2

registry:
  registry_type: sql
  path: ${FEAST_REGISTRY_PATH}

offline_store:
  type: postgres
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  database: ${POSTGRES_DB}
  db_schema: application
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  # Cloud SQL bật Enforce SSL: `disable` bị pg_hba từ chối thẳng
  # ("no encryption"). Mọi DSN khác trong repo không khai sslmode nên ăn default
  # `prefer` của libpq và tự thương lượng TLS — đây là chỗ duy nhất khai tường
  # minh, nên cũng là chỗ duy nhất vỡ. `require` = mã hoá, không verify cert máy
  # chủ; đủ cho Private IP (ENCRYPTED_ONLY chỉ đòi mã hoá). Muốn verify thì phải
  # tải CA của instance rồi thêm sslrootcert_path.
  sslmode: require

online_store:
  type: redis
  connection_string: ${REDIS_HOST}:${REDIS_PORT}
  # we dont set TTL here because each feature in redis changes infreqently 